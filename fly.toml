# Déploiement Fly.io : fly launch --copy-config --no-deploy && fly volumes create data --size 1 && fly deploy
app = "wizz"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[[mounts]]
  source = "data"
  destination = "/data"
